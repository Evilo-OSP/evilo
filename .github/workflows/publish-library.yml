name: Publish evilo library

# Publishes io.github.crowforkotlin.evilo:evilo-library to Maven Central.
# Integration plugins consume this coordinate, so the version here is a public
# API commitment: bump `evilo-plugin-sdk` in gradle/libs.versions.toml, never
# republish an existing version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and stage the deployment without uploading it
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-library
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      already: ${{ steps.published.outputs.already }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the SDK version and check the version invariant
        id: version
        run: |
          sdk=$(sed -n 's/^evilo-plugin-sdk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          app=$(sed -n 's/^EVILO_VERSION_NAME=\(.*\)$/\1/p' project.properties)
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid evilo-plugin-sdk: '$sdk'"; exit 1; }
          [[ "$app" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid EVILO_VERSION_NAME: '$app'"; exit 1; }
          # The SDK ships as part of an app release: same major.minor, independent patch.
          [[ "${sdk%.*}" == "${app%.*}" ]] || {
            echo "evilo-plugin-sdk $sdk must share major.minor with EVILO_VERSION_NAME $app."
            echo "Bump both in the same commit; the SDK patch may advance on its own."
            exit 1; }
          echo "version=$sdk" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$app" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match app version v$app."; exit 1; }
          fi
          echo "SDK $sdk for app $app"
      - name: Check whether this SDK version is already published
        id: published
        run: |
          version='${{ steps.version.outputs.version }}'
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/io/github/crowforkotlin/evilo/evilo-library/$version/evilo-library-$version.pom")
          if [[ "$status" == "200" ]]; then
            echo "evilo-library $version is already on Maven Central; skipping publication."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run library tests
        if: ${{ steps.published.outputs.already != 'true' }}
        # jvmTest covers the portable model and protocol tests. The js/wasmJs suites run in a
        # browser, and the WASI test binary cannot be instantiated by current Node releases.
        run: ./gradlew :evilo-library:jvmTest --no-daemon --no-configuration-cache
      - name: Stage the publication locally
        if: ${{ steps.published.outputs.already != 'true' }}
        run: |
          ./gradlew :evilo-library:publishToMavenLocal \
            --no-daemon --no-configuration-cache --no-build-cache
          version='${{ steps.version.outputs.version }}'
          for artifact in evilo-library evilo-library-jvm evilo-library-wasm-wasi evilo-library-android; do
            pom="$HOME/.m2/repository/io/github/crowforkotlin/evilo/$artifact/$version/$artifact-$version.pom"
            test -f "$pom" || { echo "Missing staged POM: $pom"; exit 1; }
            grep -q '<license>' "$pom" || { echo "Missing license metadata in $pom"; exit 1; }
            grep -q '<scm>' "$pom" || { echo "Missing scm metadata in $pom"; exit 1; }
          done
      - name: Check the publication footprint
        if: ${{ steps.published.outputs.already != 'true' }}
        # Central's free tier meters monthly bytes and file counts for the whole
        # organisation. Fail early instead of discovering the limit during upload.
        run: |
          version='${{ steps.version.outputs.version }}'
          # Only this release's coordinates: the shared local repository also holds
          # unrelated artifacts and must not affect the measurement.
          staged="$HOME/.m2/repository/io/github/crowforkotlin/evilo"
          total=0
          files=0
          while IFS= read -r -d '' file; do
            total=$(( total + $(stat -c %s "$file") ))
            files=$(( files + 1 ))
          done < <(find "$staged" -path "*/$version/*" -type f -print0)
          echo "staged: $files files, $(( total / 1024 )) KiB"
          (( files > 0 )) || { echo "Nothing staged under $staged."; exit 1; }
          (( total < 8 * 1024 * 1024 )) || { echo "Publication exceeds 8 MiB; trim targets or artifacts."; exit 1; }
          (( files < 60 )) || { echo "Publication exceeds 60 files; trim targets or artifacts."; exit 1; }
      - name: Verify the published sources and javadoc artifacts
        if: ${{ steps.published.outputs.already != 'true' }}
        run: |
          version='${{ steps.version.outputs.version }}'
          for artifact in evilo-library evilo-library-jvm evilo-library-wasm-wasi; do
            dir="$HOME/.m2/repository/io/github/crowforkotlin/evilo/$artifact/$version"
            test -f "$dir/$artifact-$version-sources.jar" || { echo "Missing sources for $artifact"; exit 1; }
            test -f "$dir/$artifact-$version-javadoc.jar" || { echo "Missing javadoc for $artifact"; exit 1; }
          done
  publish:
    needs: verify
    # A tag publishes the SDK only when that patch version is new; an app-only bump
    # reuses the published SDK and stops after verify.
    if: ${{ !inputs.dry_run && needs.verify.outputs.already != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" || { echo 'Configure MAVEN_CENTRAL_USERNAME.'; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" || { echo 'Configure MAVEN_CENTRAL_PASSWORD.'; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" || { echo 'Configure MAVEN_CENTRAL_SIGNING_KEY.'; exit 1; }
          # The Kotlin signing tasks cannot be serialized into the configuration cache.
          ./gradlew :evilo-library:publishToMavenCentral \
            --no-daemon --no-configuration-cache --no-build-cache
      - name: Report the published coordinates
        if: ${{ success() }}
        run: |
          version=$(sed -n 's/^evilo-plugin-sdk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Published \`io.github.crowforkotlin.evilo:evilo-library:$version\`.

          Central processing is asynchronous; check https://central.sonatype.com/publishing/deployments
          and https://repo1.maven.org/maven2/io/github/crowforkotlin/evilo/evilo-library/$version/ before
          updating consumers.
          EOF
